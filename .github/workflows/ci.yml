name: CI
on:
  push:
defaults:
  run:
    shell: nix develop --command bash -euo pipefail {0}
env:
  CACHE_NAME: qois
  CACHE_REPOSITORY: qois:qois-infrastructure
jobs:
  build:
    runs-on: nix
    steps:
      - name: Initialize CI
        uses: https://git.qo.is/qo.is/actions-nix-init@main
        with:
          token: ${{ secrets.CI_TOKEN }}
          lfs: false
      - name: Setup Attic Cache
        env:
          SERVER: https://attic.qo.is/
          ATTIC_AUTH_TOKEN: ${{ secrets.ATTIC_AUTH_TOKEN }}
        run: |
          attic login "$CACHE_NAME" "$SERVER" "$ATTIC_AUTH_TOKEN"
          attic use "$CACHE_REPOSITORY"
      - name: Run Builds and Checks
        run: nix-fast-build --no-nom --max-jobs 2 --eval-workers 2 --eval-max-memory-size 4096 --skip-cached --attic-cache "$CACHE_REPOSITORY"
  automerge-flake-lock:
    needs: build
    if: success() && github.ref == 'refs/heads/update/flake-lock'
    runs-on: nix
    steps:
      - name: Initialize CI
        uses: https://git.qo.is/qo.is/actions-nix-init@main
        with:
          token: ${{ secrets.CI_TOKEN }}
          lfs: false
      - name: Verify the built commit only updates flake.lock and private
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor origin/main HEAD
          changed=$(git diff --name-only --no-renames origin/main HEAD)
          unexpected=$(grep -vxE 'flake\.lock|private' <<<"$changed" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes: $unexpected"
            exit 1
          fi
      - name: Fast-forward main
        run: git push origin "HEAD:refs/heads/main"
  deploy:
    needs: build
    if: success() && github.ref == 'refs/heads/main'
    runs-on: nix
    env:
      SSH_DEPLOY_KEY: "${{ secrets.SSH_DEPLOY_KEY }}"
    strategy:
      matrix:
        profile:
          - docs-ops.qo.is
          - system-vm
          - system-physical
    steps:
      - name: Initialize CI
        uses: https://git.qo.is/qo.is/actions-nix-init@main
        with:
          token: ${{ secrets.CI_TOKEN }}
          lfs: false
      - name: "Deploy profile"
        run: "auto-deploy ${{ matrix.profile }}"
  deploy-ci:
    needs: deploy
    if: success() && github.ref == 'refs/heads/main'
    runs-on: nix
    env:
      SSH_DEPLOY_KEY: "${{ secrets.SSH_DEPLOY_KEY }}"
    steps:
      - name: Initialize CI
        uses: https://git.qo.is/qo.is/actions-nix-init@main
        with:
          token: ${{ secrets.CI_TOKEN }}
          lfs: false
      - name: "Deploy profile"
        run: "auto-deploy system-ci"
